version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Mọi package khai báo @types/node ^20 vì runtime là Node 20 ở mọi nơi
      # (.nvmrc, Dockerfile server/client, CI). Type mới hơn cho gọi API mà
      # Node 20 không có. Khi nâng Node: đổi .nvmrc + Dockerfile + @types/node
      # trong cùng 1 PR, và gỡ (hoặc dời) rule này.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
